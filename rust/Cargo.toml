[package]
name = "analog-level-sensor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Analog level sensor Doover app, rewritten in Rust on the doover-rs client library"

[[bin]]
name = "analog-level-sensor"
path = "src/main.rs"

[dependencies]
# The Rust equivalent of pydoover. During local development we depend on the
# sibling doover-rs checkout by path so the app tracks library changes
# immediately. For CI / reproducible image builds, swap this for a pinned git
# revision (or a published version once doover-rs cuts releases), e.g.:
#   doover = { git = "https://github.com/getdoover/doover-rs", rev = "…" }
doover = { path = "../../doover-rs/doover" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

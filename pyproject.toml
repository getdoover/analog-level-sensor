[project]
name = "analog-level-sensor"
version = "0.1.0"
description = "Doover application for analog (4-20mA) level sensors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover==1.0.0a8",
]

[project.scripts]
doover-app-run = "analog_level_sensor:main"
export-config = "analog_level_sensor.app_config:export"
export-ui = "analog_level_sensor.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio==1.65.1",
    "protobuf==5.28.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]


name: Build & Deploy Processor

on:
  workflow_dispatch:
    inputs:
      staging:
        description: "Deploy to staging?"
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  PROCESSOR_APP_NAME: analog_level_sensor_processor
  DOOVER_DATA_API_BASE_URL: ${{ vars.DOOVER_DATA_API_BASE_URL || 'https://data.doover.com/api' }}

jobs:
  build_processor_package:
    name: Build Processor Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build package.zip
        run: ./build.sh

      - name: Check package.zip exists
        run: test -f package.zip

  deploy_processor:
    name: Deploy Processor
    needs: build_processor_package
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --locked --all-extras --dev

      - name: Publish processor
        env:
          DOOVER_API_TOKEN: ${{ secrets.DOOVER_API_TOKEN }}
        run: |
          STAGING_FLAG=""
          if [ "${{ github.event.inputs.staging || 'false' }}" = "true" ]; then
            STAGING_FLAG="--staging"
          fi

          uv run doover app publish \
            --app-name "$PROCESSOR_APP_NAME" \
            --no-build-container \
            --no-build-widget \
            --no-put-widget \
            $STAGING_FLAG \
            .
